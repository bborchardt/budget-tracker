[package]
name = "budget-tracker"
version = "0.1.0"
description = "Local-only annual budget, income, and savings tracker"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "budget_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
regex = "1.13.1"
thiserror = "2.0.21"
